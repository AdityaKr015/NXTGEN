services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nxtgen
      POSTGRES_PASSWORD: nxtgen
      POSTGRES_DB: nxtgen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nxtgen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  migrator:
    build:
      context: .
      target: migrator
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"] 

volumes:
  pgdata:
  redisdata:
